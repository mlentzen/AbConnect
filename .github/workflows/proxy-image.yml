name: proxy image

# Lint and tests on every branch and pull request that touches the proxy.
# On main, the image is health-checked. It is published only when the git tag
# proxy/v<version> does not exist yet, as :<version> and :latest. The quadlet
# tracks :latest (deploy/abconnect-proxy.container).
on:
  push:
    branches: ["**"]
    paths:
      - "proxy/**"
      - ".github/workflows/proxy-image.yml"
  pull_request:
    paths:
      - "proxy/**"
      - ".github/workflows/proxy-image.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Dependencies
        run: pip install -e './proxy[dev]'
      - name: Lint
        run: ruff check proxy
      - name: Tests
        run: python -m pytest proxy/tests

  container:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f proxy/Containerfile -t abconnect-proxy:ci proxy

      - name: Health check
        run: |
          set -euo pipefail
          cat > users.toml <<'EOF'
          [users.ci]
          tokens = ["0123456789abcdef"]
          abs_url = "https://audiobookshelf.example.com"
          abs_api_key = "0123456789abcdef"
          EOF
          chmod 0444 users.toml
          docker run -d --name abconnect-proxy-ci -p 127.0.0.1:8080:8080 \
            -v "$PWD/users.toml:/run/secrets/users.toml:ro" \
            abconnect-proxy:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          docker logs abconnect-proxy-ci
          exit 1

  publish:
    needs: container
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: proxy-image
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A missing tag is an unpublished version. The tag is pushed only after
      # the image exists, so a failed publish is retried on the next main run.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' proxy/pyproject.toml)
          test -n "$version"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "proxy version must be X.Y.Z, got: ${version}" >&2
            exit 1
          fi
          tag="proxy/v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          remote=$(git ls-remote --tags origin "refs/tags/${tag}")
          if printf '%s\n' "$remote" | awk -v tag="refs/tags/${tag}" '$2 == tag { found=1 } END { exit !found }'; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${tag} already exists; image publish skipped."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Image name
        if: steps.version.outputs.release == 'true'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/abconnect-proxy" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
        if: steps.version.outputs.release == 'true'

      - uses: docker/login-action@v4
        if: steps.version.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.version.outputs.release == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - id: push
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: proxy
          file: proxy/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Annotated tag on this commit. The identity is the runner's, not a
      # person's; the checkout token can push tags and does not start this
      # workflow again.
      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "abconnect-proxy ${{ steps.version.outputs.version }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"
