[project]
name = "abconnect-proxy"
version = "0.1.0"
description = "Audiobookshelf companion for the Connect IQ app AbConnect"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.8", "vulture>=2.16"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["abconnect_proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "RUF"]
# FastAPI's Depends() in argument defaults is the framework's idiom.
ignore = ["B008"]
